<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nellie Bly - Music</title>
    <link rel="stylesheet" href="player/player-styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-bottom: 100px;
        }
        header {
            width: 100%;
            position: relative;
        }
        .header-image {
            width: 100%;
            height: auto;
            display: block;
        }
        .logo-image {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translate(-50%, 0);
            width: 40vw;
            max-width: 500px;
            height: auto;
            cursor: pointer;
        }
        @media (max-width: 600px) {
            .logo-image {
                top: 2%;
                width: 60vw;
                max-width: 300px;
            }
        }
        .social-media {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .social-media a img {
            width: 60px;
            height: 60px;
            margin: 0 10px;
        }
        .banner {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
            margin: 20px auto;
        }
        .album {
            margin-bottom: 50px;
            border: 1px solid #ccc;
            padding: 20px;
            max-width: 800px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .album img {
            width: 100%;
            max-width: 200px;
            height: auto;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
  <header>
    <img src="assets/images/header.png" alt="Nellie Bly Band" class="header-image">
    <img src="assets/images/logo.png" alt="Nellie Bly Logo" class="logo-image">
    <div class="social-media">
        <a href="https://open.spotify.com/artist/0WzQikoS3ofPxH8coNg3HX" target="_blank"><img src="assets/icons/spotify.png" alt="Spotify"></a>
        <a href="https://music.apple.com/us/artist/nellie-bly/1589629463" target="_blank"><img src="assets/icons/apple.png" alt="Apple"></a>
        <a href="https://www.instagram.com/nellieblyband/" target="_blank"><img src="assets/icons/instagram.png" alt="Instagram"></a>
        <a href="https://www.facebook.com/officialnelliebly" target="_blank"><img src="assets/icons/facebook.png" alt="Facebook"></a>
        <a href="https://www.youtube.com/@nellieblyband" target="_blank"><img src="assets/icons/youtube.png" alt="YouTube"></a>
    </div>

    <!-- Banner 1: Store -->
    <a href="https://nellie-bly-merch.myshopify.com/" target="_blank">
        <img src="assets/images/store-banner.png" alt="Visit our store" class="banner">
    </a>

    <!-- Banner 2: Calendar -->
    <a href="calendar.html" target="_blank">
        <img src="assets/images/calendar-banner.png" alt="Check our calendar" class="banner">
    </a>
  </header>
  <h1>Our Music</h1>

    <!-- Album 1: Unfamiliarity -->
    <div class="album">
        <img src="assets/artwork/unfamiliarity.jpg" alt="Unfamiliarity Album Cover">
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/album/6ybB1ea1AbnvQWUGnxRt0Y?utm_source=generator" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <!-- Album 2: There's No Place Like Here and Now -->
    <div class="album">
        <img src="assets/artwork/theres-no-place-like-here-and-now.jpg" alt="There's No Place Like Here and Now Album Cover">
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/album/4jVQelb9jVZU5znxXpoDWC?utm_source=generator" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <!-- Album 3: n0t-s3lf-t1tl3d -->
    <div class="album">
        <img src="assets/artwork/n0t-s3lf-t1tl3d.jpg" alt="n0t-s3lf-t1tl3d Album Cover">
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/album/4lC2AVTwHtdOsqGF6dKLxe?utm_source=generator" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <footer>
        <p>For booking, contact our official <a href="mailto:0nellieshere@gmail.com">e-mail</a></p>
    </footer>
</body>
</html>
