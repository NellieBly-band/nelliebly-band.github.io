<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nellie Bly — Official</title>

  <!-- Social rail + basic page + hero styles (self-contained) -->
  <style>
    :root{
      --rail-left-inset: 6px;
      --rail-max-size: 64px;
      --rail-min-size: 36px;
      --rail-mobile-size: 44px;
      --page-max-width: 1100px;
      --bg: #0b0b0b;
      --panel-bg: rgba(255,255,255,0.02);
      --text: #eee;
      --mobile-rail-gutter: 12px; /* space between rail and content on mobile */
    }

    /* ---------- Social rail styles ---------- */
    .social-rail { pointer-events: auto; font-family: inherit; }
    .social-rail__nav { display:flex; flex-direction:column; gap:clamp(6px,1.6vh,12px); padding:6px; align-items:center; }
    .social-rail__link {
      display:inline-block;
      width: clamp(var(--rail-min-size), 6.5vw, var(--rail-max-size));
      line-height:0;
      transition: transform .18s cubic-bezier(.2,.9,.2,1), box-shadow .18s, filter .18s;
      -webkit-tap-highlight-color: transparent;
      will-change: transform;
    }
    .social-rail__link img { width:100%; height:auto; display:block; object-fit:contain; border-radius:10%; box-shadow:0 8px 18px rgba(0,0,0,0.45); transition: transform .18s cubic-bezier(.2,.9,.2,1), box-shadow .18s, filter .18s; }

    /* Hover & focus */
    .social-rail__link:hover img,
    .social-rail__link:focus img {
      transform: translateX(-8px) scale(1.12);
      box-shadow: 0 18px 28px rgba(0,0,0,0.55);
      filter: saturate(1.05);
      outline:none;
    }

    /* Fixed rail (always visible) */
    .social-rail--fixed {
      position: fixed;
      left: var(--rail-left-inset);
      top: 50%;
      transform: translateY(-50%);
      z-index: 9999;
      pointer-events: auto;
      touch-action: manipulation;
    }

    /* Inline rail kept in DOM if present but hidden to avoid pushing layout */
    .social-rail--inline {
      display: none !important;
    }

    /* Smaller icon sizes for narrow devices */
    @media (max-width:640px) {
      .social-rail__link { width: clamp(30px, 10vw, var(--rail-mobile-size)); }
      .social-rail__link img { border-radius: 8%; }
      .social-rail--fixed { left: 6px; } /* keep a small inset so it isn't flush to edge */
    }

    .social-rail__link:focus { outline:3px solid rgba(255,255,255,0.12); outline-offset:3px; border-radius:8px; }

    /* ---------- Page layout ---------- */
    html,body { height:100%; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; line-height:1.35; color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
    .container { max-width:var(--page-max-width); margin:0 auto; padding: 0 18px; box-sizing:border-box; }

    /* ---------- Hero (header image + centered logo) ---------- */
    .hero {
      position: relative;
      display:flex;
      align-items:center;
      justify-content:center;
      margin: 20px auto;
      width:100%;
      box-sizing:border-box;
      overflow: visible; /* ensure overlapping logo is visible */
    }

    .hero .hero-inner {
      width:100%;
      max-width: var(--page-max-width);
      margin: 0 auto;
      position: relative;
      display:block;
      text-align:center;
    }

    .hero-img {
      width:100%;
      height:auto;
      display:block;
      border-radius:8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .hero-logo {
      position: absolute;
      left: 50%;
      top: 80%;
      transform: translate(-50%,-50%);
      max-width: 56%;
      width: clamp(140px, 38%, 520px);
      height: auto;
      display:block;
      pointer-events:none;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.6));
    }

    /* ---------- Mobile: larger logo overlapping header bottom ---------- */
    @media (max-width:720px) {
      /* Mobile: make logo much larger and pull it up so it overlaps header bottom */
      .hero-logo {
        position: static;
        transform: none;
        margin: -110px auto 0;             /* increased negative margin to pull logo up */
        width: clamp(300px, 72%, 720px);   /* almost double the previous mobile size */
        pointer-events:auto;
        z-index: 6;
      }
      .hero-inner { padding: 0 6px; }

      /* Make sure main content starts below the overlapping logo so it doesn't get covered */
      main { padding-top: 140px; } /* increase padding to account for larger logo overlap */
    }

    /* ---------- Main content (music & sidebar) ---------- */
    main { padding: 6px 0 32px; }

    /* We want the music + sidebar to visually "hang" on the right side on small screens.
       On wide screens we keep the normal centered layout. On small screens we offset the container
       so that the left fixed rail never overlaps content. */
    .music-section { display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap; justify-content:center; }
    .music-content { flex:1 1 560px; min-width:280px; }
    .sidebar { flex:0 0 320px; min-width:220px; background: var(--panel-bg); padding:12px; border-radius:8px; }

    /* Widgets area styling */
    .widgets { margin-top:14px; display:flex; flex-direction:column; gap:12px; align-items:center; }
    .widget { background: var(--panel-bg); padding:10px; border-radius:8px; color:#ddd; width:100%; box-sizing:border-box; }

    /* ---------- Ensure first widget stays square at all sizes ---------- */
    .widget.square {
      margin: 0 auto;
      width: 100%;
      max-width: 520px;       /* desktop max size for the square widget */
      aspect-ratio: 1 / 1;    /* keeps it square */
      position: relative;
      padding: 0;
      overflow: hidden;
      box-sizing: border-box;
    }
    .widget.square iframe {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
      display: block;
    }
    @media (max-width:420px) {
      .widget.square { max-width: 360px; }
    }

    .widget:not(.square) iframe,
    .widget:not(.square) embed,
    .widget:not(.square) object {
      width: 100% !important;
      max-width: 100%;
      box-sizing: border-box;
      height: auto;
    }

    .widget iframe[style] { max-height: 80vh; }
    @media (max-width:420px) {
      .widget iframe[style] { min-height: 180px; }
    }

    /* ---------- Mobile behavior: hang content on the right so left rail never overlaps ---------- */
    @media (max-width:640px) {
      /* width available for content = viewport width minus rail width and gutter */
      .container {
        width: calc(100% - (var(--rail-mobile-size) + var(--mobile-rail-gutter)));
        max-width: none;
        margin: 0; /* we'll set an explicit left margin so the content sits to the right */
        padding: 0 12px 0 12px;
        box-sizing: border-box;
      }

      /* push the whole container to the right by the rail width + gutter */
      .container.hang-right {
        margin-left: calc(var(--rail-mobile-size) + var(--mobile-rail-gutter));
      }

      /* ensure music + sidebar area aligns to the right within the container */
      .music-section { justify-content: flex-end; }

      /* widgets keep aligned to the right so the visual column remains anchored */
      .widgets { align-items: flex-end; }
      .widget { width: 100%; }
    }

    /* Footer */
    footer { padding:18px 0 36px; text-align:center; color:#bdbdbd; background:transparent; margin-top:36px; }
    .footer-gmail img { width:44px; height:auto; vertical-align:middle; }

    /* Small niceties */
    h2, h3 { color:#fff; margin:0 0 8px 0; text-align:center; }
    p { margin:0 0 12px 0; color:#d6d6d6; text-align:center; }
    ul { margin:8px 0 0 18px; padding:0; color:#d0d0d0; }

	/* Force the three non-square music widgets to a fixed, consistent size */
	.widgets {
 	 overflow-x: auto;               /* allow horizontal scrolling on narrow screens */
 	 -webkit-overflow-scrolling: touch;
	  gap: 12px;
	  padding-bottom: 8px;
	}

	.widgets .widget:not(.square) {
	  flex: 0 0 520px !important;     /* fixed width for each widget */
	  width: 100%; max-width: 520px;
	  height: 120px !important;       /* fixed height for each widget */
	  max-width: none !important;
	  box-sizing: border-box;
	}

	.widgets .widget:not(.square) iframe,
	.widgets .widget:not(.square) embed,
	.widgets .widget:not(.square) object {
	  width: 100% !important;
	  height: 100% !important;
	  border: 0 !important;
	  display: block;
	}
  </style>
</head>
<body>

  <!-- Fixed left social rail (always visible; does not push content) -->
  <div class="social-rail social-rail--fixed" aria-hidden="false">
    <nav aria-label="Social links" class="social-rail__nav">
      <!-- ORDER: bandcamp > youtube > spotify > itunes > instagram > tiktok > facebook -->
      <a href="https://nelliebly.bandcamp.com/music" class="social-rail__link" target="_blank" rel="noopener noreferrer" aria-label="Bandcamp">
        <img src="/assets/icons/bandcamp.png" alt="Bandcamp">
      </a>
      <a href="https://www.youtube.com/@nellieblyband" class="social-rail__link" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
        <img src="/assets/icons/youtube.png" alt="YouTube">
      </a>
      <a href="https://open.spotify.com/artist/0WzQikoS3ofPxH8coNg3HX?si=us2gskgCTB2LUKSSjt7PYw" class="social-rail__link" target="_blank" rel="noopener noreferrer" aria-label="Spotify">
        <img src="/assets/icons/spotify.png" alt="Spotify">
      </a>
      <a href="https://music.apple.com/us/artist/nellie-bly/1589629463" class="social-rail__link" target="_blank" rel="noopener noreferrer" aria-label="Apple Music">
        <img src="/assets/icons/itunes.png" alt="Apple Music">
      </a>
      <a href="https://www.instagram.com/nellieblyband" class="social-rail__link" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <img src="/assets/icons/instagram.png" alt="Instagram">
      </a>
      <a href="https://www.tiktok.com/@nellieblyofficial" class="social-rail__link" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
        <img src="/assets/icons/tiktok.png" alt="TikTok">
      </a>
      <a href="https://www.facebook.com/officialnelliebly" class="social-rail__link" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
        <img src="/assets/icons/facebook.png" alt="Facebook">
      </a>
    </nav>
  </div>

  <!-- HERO: centered header image with centered logo overlay (desktop) / stacked on mobile -->
  <header class="hero" role="banner" aria-label="Site header">
    <div class="hero-inner container">
      <img class="hero-img" src="/assets/images/header.png" alt="Nellie Bly header image">
      <img class="hero-logo" src="/assets/images/logo.png" alt="Nellie Bly logo">
    </div>
  </header>

  <!-- Add class "hang-right" to the container on mobile so content shifts right and never overlaps the rail.
       We add it by default here; it only affects small screens via the media query above. -->
  <main class="container hang-right">
    <section class="music-section" aria-labelledby="music-heading">

      <!-- (inline rail element remains in DOM but hidden so it doesn't push layout) -->
      <div class="social-rail social-rail--inline" aria-hidden="true" style="margin-right:12px;">
        <nav aria-label="Social links" class="social-rail__nav" aria-hidden="true">
          <a class="social-rail__link"><img src="/assets/icons/bandcamp.png" alt=""></a>
        </nav>
      </div>

      <!-- Main music column -->
      <div class="music-content" aria-live="polite">
        <h2 id="music-heading">MUSIC</h2>
        <p>Featured releases, all of our music is free to download — please support us by donating on Bandcamp!</p>

        <!-- WIDGETS: music widgets stack (top → bottom in the order you provided) -->
        <div class="widgets" id="widgets">

          <!-- Widget #1 (SQUARE) - Bandcamp track (keeps 1:1 aspect ratio) -->
          <div class="widget square" id="widget-1">
            <iframe src="https://bandcamp.com/EmbeddedPlayer/track=219687614/size=large/bgcol=ffffff/linkcol=0687f5/tracklist=false/transparent=true/" seamless allowtransparency="true" title="Bipolar Bi-Polar Bi Polar Bear — Bandcamp player"></iframe>
          </div>

          <!-- Widget #2 (Bandcamp album strip) -->
          <div class="widget" id="widget-2">
            <iframe style="border: 0; width: 100%; height: 120px;" src="https://bandcamp.com/EmbeddedPlayer/album=3026096112/size=large/bgcol=ffffff/linkcol=0687f5/tracklist=false/artwork=small/transparent=true/" seamless>
              <a href="https://nelliebly.bandcamp.com/album/unfamiliarity">Unfamiliarity by Nellie Bly</a>
            </iframe>
          </div>

          <!-- Widget #3 -->
          <div class="widget" id="widget-3">
            <iframe style="border: 0; width: 100%; height: 120px;" src="https://bandcamp.com/EmbeddedPlayer/album=3317313395/size=large/bgcol=ffffff/linkcol=0687f5/tracklist=false/artwork=small/transparent=true/" seamless>
              <a href="https://nelliebly.bandcamp.com/album/theres-no-place-like-here-and-now">There's No Place Like Here, And Now by Nellie Bly</a>
            </iframe>
          </div>

          <!-- Widget #4 -->
          <div class="widget" id="widget-4">
            <iframe style="border: 0; width: 100%; height: 120px;" src="https://bandcamp.com/EmbeddedPlayer/album=406280984/size=large/bgcol=ffffff/linkcol=0687f5/tracklist=false/artwork=small/transparent=true/" seamless>
              <a href="https://nelliebly.bandcamp.com/album/n0t-s3lf-t1tl3d">N0T S3LF T1TL3D by Nellie Bly</a>
            </iframe>
          </div>

        </div>
        <!-- End widgets -->
      </div>

      <!-- Sidebar / tour column -->
      <aside class="sidebar" aria-labelledby="tour-heading">
        <h3 id="tour-heading">SHOW DATES</h3>
        <ul>
          <li>We Livestream all of our shows on Instagram!!!</li>
        </ul>

        <!-- SONGKICK WIDGET -->
        <div style="margin-top:12px;">
          <a href="https://www.songkick.com/artists/1532191" class="songkick-widget" data-theme="dark" data-track-button="on" data-detect-style="off" data-background-color="rgb(0,0,0,1)" data-font-color="rgb(255,255,255,1)" data-button-bg-color="rgb(255,255,255,1)" data-button-text-color="rgb(0,0,0,1)" data-locale="en" data-other-artists="on" data-share-button="on" data-country-filter="on" data-rsvp="on" data-request-show="on" data-past-events="off" data-past-events-offtour="off" data-remind-me="off" style="display: none;"></a>
          <script src='//widget-app.songkick.com/injector/1532191'></script>
        </div>
      </aside>

    </section>
  </main>

  <footer id="contact-heading" class="container">
    <p>Contact e-mail for Booking</p>
    <a class="footer-gmail" href="mailto:0nellieshere@gmail.com" aria-label="Email us" target="_blank" rel="noopener noreferrer">
      <img src="/assets/icons/gmail.png" alt="Email Nellie Bly">
    </a>
    <p style="margin-top:8px; font-size:0.9rem; color:#9a9a9a;">© Nellie Bly</p>
  </footer>

</body>
</html>
